<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">claim</title>
  <desc id="d">Two polaroids. Before: you and a robot co-author shipping code at one laptop, the robot's arm round your shoulder, captioned us, shippin' it. In between: dollar claim dot. After: the same photo with the robot cut out with scissors, leaving a hole, but its hand is still on your shoulder, captioned me, shippin' it, alone. A sticky note says: known issue, the hand. Please don't check the reflog.</desc>

  <defs>
    <!-- the photo, minus the robot -->
    <g id="scene">
      <rect x="20" y="20" width="300" height="230" fill="#8fa9c4"/>
      <rect x="20" y="200" width="300" height="50" fill="#7d583c"/>
      <rect x="78" y="140" width="84" height="76" rx="28" fill="#4338ca"/>
      <circle cx="120" cy="112" r="25" fill="#a87650"/>
      <path d="M95 110 a25 25 0 0 1 50 0 q-12 -9 -25 -5 q-14 -6 -25 5z" fill="#1b140e"/>
      <circle cx="111" cy="115" r="2.6" fill="#14100c"/><circle cx="129" cy="115" r="2.6" fill="#14100c"/>
      <path d="M112 124 q8 7 16 0" fill="none" stroke="#14100c" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g id="laptop">
      <polygon points="140,202 210,202 205,166 145,166" fill="#5f6875"/>
      <circle cx="175" cy="185" r="6" fill="#a9b1bb"/>
    </g>
    <g id="robot">
      <line x1="245" y1="86" x2="245" y2="70" stroke="#4f5967" stroke-width="3"/>
      <circle cx="245" cy="67" r="5" fill="#dc2626"/>
      <rect x="217" y="86" width="56" height="48" rx="10" fill="#808a98"/>
      <circle cx="233" cy="107" r="6" fill="#0e7490"/><circle cx="257" cy="107" r="6" fill="#0e7490"/>
      <rect x="235" y="121" width="20" height="4" rx="2" fill="#4f5967"/>
      <rect x="239" y="133" width="12" height="9" fill="#4f5967"/>
      <rect x="207" y="140" width="76" height="76" rx="12" fill="#808a98"/>
      <rect x="216" y="154" width="58" height="17" rx="3" fill="#e6e6e6"/>
      <text x="245" y="166" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#1f2328">co-author</text>
    </g>
    <g id="arm">
      <path d="M209 150 C 196 120, 168 116, 152 135" fill="none" stroke="#4f5967" stroke-width="10" stroke-linecap="round"/>
      <circle cx="149" cy="139" r="9.5" fill="#4f5967"/>
    </g>
    <path id="cutline" d="M213 84 L219 79 L237 80 L238 61 L252 59 L254 79 L276 81 L280 93 L278 135 L288 139 L289 201 L202 201 L201 147 L209 137 Z"/>
    <mask id="hole" maskUnits="userSpaceOnUse" x="0" y="0" width="340" height="320">
      <rect width="340" height="320" fill="#fff"/>
      <use href="#cutline" fill="#000"/>
    </mask>
  </defs>

  <!-- before -->
  <g transform="translate(46 44) rotate(-4 170 160)">
    <rect x="6" y="9" width="340" height="320" rx="4" fill="#000000" fill-opacity="0.55"/>
    <rect width="340" height="320" rx="4" fill="#d9d5cc" stroke="#b9b4a9"/>
    <use href="#scene"/>
    <use href="#robot"/>
    <use href="#arm"/>
    <use href="#laptop"/>
    <text x="170" y="294" text-anchor="middle" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="25" fill="#1f2328">us, shippin' it</text>
  </g>

  <!-- the command in the middle -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">
    <text x="482" y="176" font-size="24" font-weight="700" fill="#e6edf3">$ claim .</text>
    <text x="482" y="268" font-size="14" fill="#9da7b3">(rewrites history)</text>
  </g>
  <path d="M418 206 C 452 236, 512 236, 546 204" fill="none" stroke="#9da7b3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M532 202 L547 203 L545 218" fill="none" stroke="#9da7b3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- after: same photo, one fewer author -->
  <g transform="translate(580 36) rotate(3 170 160)">
    <rect x="6" y="9" width="340" height="320" rx="4" fill="#000000" fill-opacity="0.55"/>
    <g mask="url(#hole)">
      <rect width="340" height="320" rx="4" fill="#d9d5cc" stroke="#b9b4a9"/>
      <use href="#scene"/>
      <use href="#arm"/>
    </g>
    <use href="#cutline" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5 4"/>
    <use href="#laptop"/>
    <text x="170" y="294" text-anchor="middle" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="25" fill="#1f2328">me, shippin' it. alone.</text>
  </g>

  <!-- the sticky note -->
  <g transform="translate(962 104) rotate(5 95 95)">
    <rect x="3" y="5" width="190" height="190" fill="#000000" fill-opacity="0.55"/>
    <rect width="190" height="190" fill="#d6b656"/>
    <rect width="190" height="24" fill="#c4a444"/>
    <g font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" fill="#231b05">
      <text x="18" y="66" font-size="22" font-weight="700">known issue:</text>
      <text x="18" y="104" font-size="30" font-weight="700">the hand.</text>
      <text x="18" y="144" font-size="18">(please don't</text>
      <text x="18" y="168" font-size="18">check the reflog)</text>
    </g>
  </g>
</svg>
