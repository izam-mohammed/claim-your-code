version: 2

project_name: claim

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/claim
    binary: claim
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # install.sh builds this exact name, so the two have to agree:
  # claim_<version>_<os>_<arch>.tar.gz
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# A formula, not a cask: casks are macOS only, and the README offers Homebrew
# on Linux too. goreleaser marks `brews` deprecated in favour of
# `homebrew_casks`; it still works, and this moves the day it stops.
brews:
  - repository:
      owner: izam-mohammed
      name: homebrew-tap
      # The default GITHUB_TOKEN cannot write to another repository.
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/izam-mohammed/claim-your-code"
    description: "Strip Co-Authored-By: Claude lines from git commits"
    license: "MIT"
    install: |
      bin.install "claim"
    test: |
      system "#{bin}/claim", "--version"

scoops:
  - repository:
      owner: izam-mohammed
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/izam-mohammed/claim-your-code"
    description: "Strip Co-Authored-By: Claude lines from git commits"
    license: "MIT"
